<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RSIZ Auction</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-white p-3 font-sans selection:bg-yellow-500 selection:text-black">
    <div class="max-w-md mx-auto pb-6">
        <h1 class="text-2xl font-bold text-center text-yellow-500 mb-4">🔨 RSIZ Auction</h1>

        <div class="bg-gray-800 rounded-2xl overflow-hidden border border-gray-700 shadow-2xl">
            <div class="relative w-full h-56 bg-gray-950 flex items-center justify-center overflow-hidden">
                <img id="lot-img" src="" alt="Лот" class="w-full h-full object-cover opacity-90">
                <div class="absolute bottom-2 left-2 bg-black/60 backdrop-blur-md text-xs px-2.5 py-1 rounded-full flex items-center gap-1">
                    📍 <span id="lot-location" class="text-gray-200">Загрузка...</span>
                </div>
            </div>

            <div class="p-4">
                <h2 id="lot-title" class="text-xl font-bold text-white tracking-tight">Загрузка...</h2>
                <div id="lot-desc" class="text-gray-400 text-sm mt-2 leading-relaxed bg-gray-900/40 p-3 rounded-lg border border-gray-700/50">...</div>
                
                <div class="flex justify-between items-center mt-4 bg-gray-700/60 backdrop-blur-sm p-3 rounded-xl border border-gray-600/30">
                    <div>
                        <span class="text-xs text-gray-400 block uppercase font-medium tracking-wider">Текущая ставка</span>
                        <span id="lot-price" class="text-2xl font-black text-green-400">0 грн</span>
                        <div class="flex gap-2 mt-0.5 text-[11px] text-yellow-400 font-medium">
                            <span id="lot-blitz">Блиц: 0 грн</span>
                            <span class="text-gray-500">|</span>
                            <span id="lot-step" class="text-blue-400">Шаг: 0 грн</span>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-xs text-gray-400 block uppercase font-medium tracking-wider">До конца</span>
                        <span id="lot-timer" class="text-xl font-mono font-bold text-red-400 bg-gray-900/50 px-2.5 py-1 rounded-lg inline-block mt-0.5">00:00</span>
                    </div>
                </div>

                <div id="action-zone" class="mt-4 space-y-4">
                    
                    <div class="bg-gray-900/40 p-3 rounded-xl border border-gray-700/60">
                        <label class="text-xs text-gray-400 font-semibold block mb-1.5 uppercase">Сделать ставку вручную:</label>
                        <div class="flex gap-2">
                            <input type="number" id="bid-input" class="w-1/2 bg-gray-900 border border-gray-600 focus:border-yellow-500 rounded-xl py-2.5 px-3 text-center text-lg font-bold text-white outline-none" placeholder="Сумма (грн)">
                            <button onclick="placeBid()" class="w-1/2 bg-yellow-500 text-gray-900 font-extrabold py-2.5 rounded-xl text-sm tracking-wide active:scale-[0.97] transition-all hover:bg-yellow-600">Поставить</button>
                        </div>
                    </div>

                    <div class="bg-gray-900/40 p-3 rounded-xl border border-gray-700/60">
                        <div class="flex justify-between items-center mb-1.5">
                            <label class="text-xs text-gray-400 font-semibold block uppercase">Автоторг (Proxy Bidding):</label>
                            <span id="my-auto-status" class="text-[11px] text-gray-500 font-mono">Выключен</span>
                        </div>
                        <div class="flex gap-2">
                            <input type="number" id="auto-input" class="w-1/2 bg-gray-900 border border-gray-600 focus:border-blue-500 rounded-xl py-2.5 px-3 text-center text-lg font-bold text-white outline-none" placeholder="Макс. лимит">
                            <button onclick="setupAutoBid()" class="w-1/2 bg-blue-600 text-white font-bold py-2.5 rounded-xl text-sm tracking-wide active:scale-[0.97] transition-all hover:bg-blue-700">Включить робота</button>
                        </div>
                    </div>

                    <button onclick="placeBlitzBid()" class="w-full bg-red-600 text-white font-bold py-3 rounded-xl text-sm tracking-wide transition-all active:scale-[0.98] hover:bg-red-700">⚡ Купить сейчас (Блиц)</button>
                </div>

                <div id="pay-zone" class="mt-4 hidden text-center bg-yellow-500/10 border border-yellow-500/20 p-4 rounded-xl">
                    <p class="text-yellow-400 text-sm mb-3 font-medium">🎉 Поздравляем, вы победили! Оплатите комиссию, чтобы забрать лот:</p>
                    <button onclick="payCommission()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-extrabold py-3.5 rounded-xl shadow-lg">🌟 Оплатить звездами</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        // ⚠️ ВАЖНО: ЗАМЕНИ ЭТУ ССЫЛКУ НА СВОЮ АКТУАЛЬНУЮ ИЗ ОКНА ТЕРМИНАЛА!
        const API_URL = 'https://two-bottles-sort.loca.lt'; 
        
        const userId = tg.initDataUnsafe?.user?.id || 12345; 
        let currentLot = null;
        let timerInterval = null;

        async function loadLot() {
            try {
                const res = await fetch(`${API_URL}/api/lots`);
                if (!res.ok) throw new Error(`Сервер вернул ошибку со статусом ${res.status}`);
                
                const text = await res.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch(parseError) {
                    if (text.includes("tunnel") || text.includes("Bypass") || text.includes("Click to Continue")) {
                        throw new Error("Туннель заблокирован защитой LocalTunnel. Открой эту ссылку в обычном браузере на ПК и нажми синюю кнопку 'Click to Continue'!");
                    }
                    throw new Error("Сервер ответил не в формате JSON. Возможно, туннель упал или адрес указан неверно.");
                }

                currentLot = data[0];
                if (!currentLot) {
                    document.getElementById('lot-title').innerText = "Лоты не найдены";
                    return;
                }

                document.getElementById('lot-title').innerText = currentLot.title;
                document.getElementById('lot-desc').innerText = currentLot.description;
                document.getElementById('lot-price').innerText = `${currentLot.currentBid} грн`;
                document.getElementById('lot-blitz').innerText = `Блиц: ${currentLot.blitzPrice} грн`;
                document.getElementById('lot-step').innerText = `Шаг: ${currentLot.minStep} грн`;
                document.getElementById('lot-location').innerText = currentLot.location;
                document.getElementById('lot-img').src = currentLot.imageUrl;

                document.getElementById('bid-input').placeholder = `>= ${currentLot.currentBid + currentLot.minStep}`;

                if (currentLot.autoBids && currentLot.autoBids[userId]) {
                    document.getElementById('my-auto-status').innerText = `Лимит: ${currentLot.autoBids[userId]} грн`;
                    document.getElementById('my-auto-status').classList.remove('text-gray-500');
                    document.getElementById('my-auto-status').classList.add('text-green-400');
                }

                if (timerInterval) clearInterval(timerInterval);

                timerInterval = setInterval(() => {
                    const diff = currentLot.endTime - Date.now();
                    if (diff <= 0 || currentLot.status === 'finished') {
                        clearInterval(timerInterval);
                        document.getElementById('lot-timer').innerText = "Завершен";
                        document.getElementById('action-zone').classList.add('hidden');
                        
                        if (currentLot.winnerId === userId && currentLot.status !== 'paid') {
                            document.getElementById('pay-zone').classList.remove('hidden');
                        }
                    } else {
                        const mins = Math.floor(diff / 60000);
                        const secs = Math.floor((diff % 60000) / 1000);
                        document.getElementById('lot-timer').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                    }
                }, 1000);
            } catch(e) { 
                console.error(e);
                document.getElementById('lot-title').innerText = "❌ Ошибка соединения!";
                document.getElementById('lot-desc').innerHTML = `
                    <div class="text-red-400 font-bold mb-3">${e.message}</div>
                    <div class="text-xs text-gray-400 p-2 bg-gray-900 rounded border border-gray-700">
                        <b>Адрес, прописанный в index.html:</b><br>
                        <span class="text-yellow-400 font-mono block my-1">${API_URL}</span>
                        Убедись, что эта ссылка один в один совпадает с той, которую выдал тебе терминал!
                    </div>
                `;
            }
        }

        async function placeBid() {
            let amount = parseInt(document.getElementById('bid-input').value);
            if (!amount) return alert('Введите сумму ставки');
            sendBidRequest(amount);
        }

        async function placeBlitzBid() {
            sendBidRequest(currentLot.blitzPrice);
        }

        async function sendBidRequest(amount) {
            try {
                const res = await fetch(`${API_URL}/api/bid`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lotId: 1, userId, bidAmount: amount })
                });
                const data = await res.json();
                if (data.error) {
                    alert(data.error);
                } else {
                    alert('Ставка обработана!');
                    document.getElementById('bid-input').value = '';
                    loadLot();
                }
            } catch(err) {
                alert("Ошибка отправки запроса: " + err.message);
            }
        }

        async function setupAutoBid() {
            let maxLimit = parseInt(document.getElementById('auto-input').value);
            if (!maxLimit) return alert('Укажите максимальный лимит для автоторга');

            try {
                const res = await fetch(`${API_URL}/api/set-autobid`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lotId: 1, userId, maxLimit })
                });
                const data = await res.json();
                if (data.error) {
                    alert(data.error);
                } else {
                    alert('Автоторг успешно активирован!');
                    document.getElementById('auto-input').value = '';
                    loadLot();
                }
            } catch(err) {
                alert("Ошибка активации автоторга: " + err.message);
            }
        }

        async function payCommission() {
            try {
                const res = await fetch(`${API_URL}/api/invoice`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lotId: 1, userId })
                });
                const data = await res.json();
                if (data.invoiceLink) {
                    tg.openInvoice(data.invoiceLink, (status) => { if (status === 'paid') tg.close(); });
                }
            } catch(err) {
                alert("Ошибка платежа: " + err.message);
            }
        }
        loadLot();
    </script>
</body>
</html>
