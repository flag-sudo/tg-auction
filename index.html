<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auction Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-white p-4 font-sans">
    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold text-center text-yellow-500 mb-6">🔨 Мой Аукцион</h1>

        <div class="bg-gray-800 rounded-xl p-5 border border-gray-700 shadow-xl">
            <h2 id="lot-title" class="text-xl font-semibold">Загрузка...</h2>
            <p id="lot-desc" class="text-gray-400 text-sm mt-1">...</p>
            
            <div class="flex justify-between items-center mt-4 bg-gray-700 p-3 rounded-lg">
                <div>
                    <span class="text-xs text-gray-400 block">Текущая ставка</span>
                    <span id="lot-price" class="text-xl font-bold text-green-400">0 грн</span>
                </div>
                <div class="text-right">
                    <span class="text-xs text-gray-400 block">До конца</span>
                    <span id="lot-timer" class="text-md font-mono text-red-400">00:00</span>
                </div>
            </div>

            <div id="action-zone" class="mt-5">
                <input type="number" id="bid-input" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2 text-center text-lg text-white" placeholder="Сумма в грн">
                <button onclick="placeBid()" class="w-full mt-3 bg-yellow-500 text-gray-900 font-bold py-3 rounded-lg">Сделать ставку</button>
            </div>

            <div id="pay-zone" class="mt-5 hidden text-center">
                <p class="text-yellow-400 text-sm mb-2">Вы выиграли! Оплатите комиссию 10% для получения контакта</p>
                <button onclick="payCommission()" class="w-full bg-blue-500 text-white font-bold py-3 rounded-lg">🌟 Оплатить звездами</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        // ПОКА ОСТАВЛЯЕМ ТАК, СЮДА МЫ ПОТОМ ВСТАВИМ ССЫЛКУ ИЗ NGROK:
        const API_URL = 'https://tricky-humans-throw.loca.lt'; 
        const userId = tg.initDataUnsafe?.user?.id || 12345; 
        let currentLot = null;

        async function loadLot() {
            try {
                const res = await fetch(`${API_URL}/api/lots`);
                const data = await res.json();
                currentLot = data[0];
                if (!currentLot) return;

                document.getElementById('lot-title').innerText = currentLot.title;
                document.getElementById('lot-desc').innerText = currentLot.description;
                document.getElementById('lot-price').innerText = `${currentLot.currentBid} грн`;

                const interval = setInterval(() => {
                    const diff = currentLot.endTime - Date.now();
                    if (diff <= 0) {
                        clearInterval(interval);
                        document.getElementById('lot-timer').innerText = "Завершен";
                        document.getElementById('action-zone').classList.add('hidden');
                        if (currentLot.winnerId === userId && currentLot.status !== 'paid') {
                            document.getElementById('pay-zone').classList.remove('hidden');
                        }
                    } else {
                        const mins = Math.floor(diff / 60000);
                        const secs = Math.floor((diff % 60000) / 1000);
                        document.getElementById('lot-timer').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                    }
                }, 1000);
            } catch(e) { console.log("Ошибка сети"); }
        }

        async function placeBid() {
            const amount = parseInt(document.getElementById('bid-input').value);
            if (!amount) return alert('Введите сумму');
            const res = await fetch(`${API_URL}/api/bid`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lotId: 1, userId, bidAmount: amount })
            });
            const data = await res.json();
            if (data.error) alert(data.error); else { alert('Ставка принята!'); loadLot(); }
        }

        async function payCommission() {
            const res = await fetch(`${API_URL}/api/invoice`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lotId: 1, userId })
            });
            const data = await res.json();
            if (data.invoiceLink) {
                tg.openInvoice(data.invoiceLink, (status) => { if (status === 'paid') tg.close(); });
            }
        }
        loadLot();
    </script>
</body>
</html>
