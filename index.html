<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RSIZ Auction</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { -webkit-user-select: none; user-select: none; }
    </style>
</head>
<body class="bg-gray-900 text-white p-3 font-sans selection:bg-yellow-500 selection:text-black">
    <div class="max-w-md mx-auto pb-6">
        
        <div id="main-screen">
            <h1 class="text-2xl font-bold text-center text-yellow-500 mb-2">🔨 Активные Аукционы</h1>
            
            <button onclick="openCreateScreen()" class="w-full mb-4 bg-gradient-to-r from-yellow-500 to-amber-600 text-gray-900 font-extrabold py-3 rounded-xl text-sm shadow-lg active:scale-98 transition-all flex items-center justify-center gap-1.5">
                ➕ Выставить свой лот
            </button>
            
            <div id="lots-grid" class="grid grid-cols-2 gap-3"></div>
        </div>

        <div id="create-screen" class="hidden">
            <button onclick="closeCreateScreen()" class="mb-4 bg-gray-800 hover:bg-gray-700 text-gray-300 font-medium py-2 px-4 rounded-xl text-xs border border-gray-700 active:scale-95 transition-all">
                ⬅ Отмена
            </button>
            
            <div class="bg-gray-800 rounded-2xl border border-gray-700 shadow-2xl p-4 space-y-4">
                <h2 class="text-xl font-bold text-yellow-500 border-b border-gray-700 pb-2">New Auction Item</h2>
                
                <div>
                    <label class="text-xs text-gray-400 font-semibold uppercase block mb-1">Название лота *</label>
                    <input type="text" id="c-title" class="w-full bg-gray-900 border border-gray-600 focus:border-yellow-500 rounded-xl py-2 px-3 text-sm text-white outline-none" placeholder="Например: Нож ручной работы">
                </div>

                <div>
                    <label class="text-xs text-gray-400 font-semibold uppercase block mb-1">Описание лота</label>
                    <textarea id="c-desc" rows="3" class="w-full bg-gray-900 border border-gray-600 focus:border-yellow-500 rounded-xl py-2 px-3 text-sm text-white outline-none resize-none" placeholder="Опишите состояние, комплектацию..."></textarea>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-400 font-semibold uppercase block mb-1">Нач. Ставка (грн) *</label>
                        <input type="number" id="c-price" class="w-full bg-gray-900 border border-gray-600 focus:border-yellow-500 rounded-xl py-2 px-3 text-sm text-white outline-none" placeholder="100">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 font-semibold uppercase block mb-1">Мин. Шаг (грн) *</label>
                        <input type="number" id="c-step" class="w-full bg-gray-900 border border-gray-600 focus:border-yellow-500 rounded-xl py-2 px-3 text-sm text-white outline-none" placeholder="20">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-400 font-semibold uppercase block mb-1">Блиц-цена (грн) *</label>
                        <input type="number" id="c-blitz" class="w-full bg-gray-900 border border-gray-600 focus:border-yellow-500 rounded-xl py-2 px-3 text-sm text-white outline-none" placeholder="1000">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 font-semibold uppercase block mb-1">Время (в часах)</label>
                        <input type="number" id="c-duration" class="w-full bg-gray-900 border border-gray-600 focus:border-yellow-500 rounded-xl py-2 px-3 text-sm text-white outline-none" value="2">
                    </div>
                </div>

                <div>
                    <label class="text-xs text-gray-400 font-semibold uppercase block mb-1">Местоположение</label>
                    <input type="text" id="c-location" class="w-full bg-gray-900 border border-gray-600 focus:border-yellow-500 rounded-xl py-2 px-3 text-sm text-white outline-none" placeholder="Город, Область">
                </div>

                <div>
                    <label class="text-xs text-gray-400 font-semibold uppercase block mb-1">Ссылка на фото лота</label>
                    <input type="url" id="c-img" class="w-full bg-gray-900 border border-gray-600 focus:border-yellow-500 rounded-xl py-2 px-3 text-sm text-white outline-none" placeholder="https://image-link.com/photo.jpg">
                </div>

                <button onclick="submitNewLot()" class="w-full bg-yellow-500 text-gray-900 font-extrabold py-3 rounded-xl text-sm tracking-wide active:scale-[0.97] transition-all hover:bg-yellow-600 mt-2">
                    🚀 Опубликовать лот
                </button>
            </div>
        </div>

        <div id="detail-screen" class="hidden">
            <button onclick="backToMain()" class="mb-4 bg-gray-800 hover:bg-gray-700 text-gray-300 font-medium py-2 px-4 rounded-xl text-xs border border-gray-700 flex items-center gap-1 active:scale-95 transition-all">
                ⬅ Назад к списку
            </button>

            <div class="bg-gray-800 rounded-2xl overflow-hidden border border-gray-700 shadow-2xl">
                <div class="relative w-full h-56 bg-gray-950 flex items-center justify-center overflow-hidden">
                    <img id="lot-img" src="" alt="Лот" class="w-full h-full object-cover opacity-90">
                    <div class="absolute bottom-2 left-2 bg-black/60 backdrop-blur-md text-xs px-2.5 py-1 rounded-full flex items-center gap-1">
                        📍 <span id="lot-location" class="text-gray-200">Загрузка...</span>
                    </div>
                </div>

                <div class="p-4">
                    <h2 id="lot-title" class="text-xl font-bold text-white tracking-tight">Загрузка...</h2>
                    <div id="lot-desc" class="text-gray-400 text-sm mt-2 leading-relaxed bg-gray-900/40 p-3 rounded-lg border border-gray-700/50">...</div>
                    
                    <div id="error-block" class="hidden border border-red-500 bg-red-950/40 p-3 rounded-xl mt-3 text-sm">
                        <div class="flex items-center gap-2 text-red-400 font-bold mb-1">❌ Ошибка!</div>
                        <p class="text-red-300 font-mono text-xs" id="error-message">Failed to fetch</p>
                    </div>

                    <div class="flex justify-between items-center mt-4 bg-gray-700/60 backdrop-blur-sm p-3 rounded-xl border border-gray-600/30">
                        <div>
                            <span class="text-xs text-gray-400 block uppercase font-medium tracking-wider">Текущая ставка</span>
                            <span id="lot-price" class="text-2xl font-black text-green-400">0 грн</span>
                            <div class="flex gap-2 mt-0.5 text-[11px] text-yellow-400 font-medium">
                                <span id="lot-blitz">Блиц: 0 грн</span>
                                <span class="text-gray-500">|</span>
                                <span id="lot-step" class="text-blue-400">Шаг: 0 грн</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-xs text-gray-400 block uppercase font-medium tracking-wider">До конца</span>
                            <span id="lot-timer" class="text-xl font-mono font-bold text-red-400 bg-gray-900/50 px-2.5 py-1 rounded-lg inline-block mt-0.5">00:00</span>
                        </div>
                    </div>

                    <div id="action-zone" class="mt-4 space-y-4">
                        <div class="bg-gray-900/40 p-3 rounded-xl border border-gray-700/60">
                            <label class="text-xs text-gray-400 font-semibold block mb-1.5 uppercase">Сделать ставку вручную:</label>
                            <div class="flex gap-2">
                                <input type="number" id="bid-input" class="w-1/2 bg-gray-900 border border-gray-600 focus:border-yellow-500 rounded-xl py-2.5 px-3 text-center text-lg font-bold text-white outline-none" placeholder="Сумма (грн)">
                                <button onclick="placeBid()" class="w-1/2 bg-yellow-500 text-gray-900 font-extrabold py-2.5 rounded-xl text-sm tracking-wide active:scale-[0.97] transition-all hover:bg-yellow-600">Поставить</button>
                            </div>
                        </div>

                        <div class="bg-gray-900/40 p-3 rounded-xl border border-gray-700/60">
                            <div class="flex justify-between items-center mb-1.5">
                                <label class="text-xs text-gray-400 font-semibold block uppercase">Автоторг:</label>
                                <span id="my-auto-status" class="text-[11px] text-gray-500 font-mono">Выключен</span>
                            </div>
                            <div class="flex gap-2">
                                <input type="number" id="auto-input" class="w-1/2 bg-gray-900 border border-gray-600 focus:border-blue-500 rounded-xl py-2.5 px-3 text-center text-lg font-bold text-white outline-none" placeholder="Макс. лимит">
                                <button onclick="setupAutoBid()" class="w-1/2 bg-blue-600 text-white font-bold py-2.5 rounded-xl text-sm tracking-wide active:scale-[0.97] transition-all hover:bg-blue-700">Включить</button>
                            </div>
                        </div>

                        <button onclick="placeBlitzBid()" class="w-full bg-red-600 text-white font-bold py-3 rounded-xl text-sm tracking-wide transition-all active:scale-[0.98] hover:bg-red-700">⚡ Купить сейчас (Блиц)</button>
                    </div>

                    <div id="pay-zone" class="mt-4 hidden text-center bg-yellow-500/10 border border-yellow-500/20 p-4 rounded-xl">
                        <p class="text-yellow-400 text-sm mb-3 font-medium">🎉 Поздравляем, вы победили!</p>
                        <button onclick="payCommission()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-extrabold py-3.5 rounded-xl shadow-lg">🌟 Оплатить звездами</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center text-[11px] text-gray-600 mt-6 font-mono">@rsizauction_bot</div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        const API_URL = 'https://f88009653e8b5f.lhr.life'; 

        const userId = tg?.initDataUnsafe?.user?.id || 12345; 
        let activeLotId = null;
        let isCreating = false; // Маркер нахождения на экране создания лота

        // Обход напоминания локалтаннеля
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
            let [resource, config] = args;
            if (!config) config = {};
            if (!config.headers) config.headers = {};
            if (config.headers instanceof Headers) {
                config.headers.set('bypass-tunnel-reminder', 'true');
            } else {
                config.headers['bypass-tunnel-reminder'] = 'true';
            }
            return originalFetch(resource, config);
        };

        // Логика переключения на создание лота
        function openCreateScreen() {
            isCreating = true;
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('create-screen').classList.remove('hidden');
        }

        function closeCreateScreen() {
            isCreating = false;
            document.getElementById('create-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            loadMainScreen();
        }

        // Отправка нового лота на сервер
        async function submitNewLot() {
            const title = document.getElementById('c-title').value;
            const description = document.getElementById('c-desc').value;
            const currentBid = document.getElementById('c-price').value;
            const minStep = document.getElementById('c-step').value;
            const blitzPrice = document.getElementById('c-blitz').value;
            const durationHours = document.getElementById('c-duration').value;
            const location = document.getElementById('c-location').value;
            const imageUrl = document.getElementById('c-img').value;

            if (!title || !currentBid || !blitzPrice || !minStep) {
                return alert('Заполните обязательные поля, помеченные звездочкой (*) !');
            }

            try {
                const res = await fetch(`${API_URL}/api/lots`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, description, currentBid, blitzPrice, minStep, location, imageUrl, durationHours })
                });
                const data = await res.json();
                
                if (data.error) {
                    alert(data.error);
                } else {
                    alert('Лот успешно добавлен и выставлен на торги!');
                    // Сброс полей
                    document.getElementById('c-title').value = '';
                    document.getElementById('c-desc').value = '';
                    document.getElementById('c-price').value = '';
                    document.getElementById('c-step').value = '';
                    document.getElementById('c-blitz').value = '';
                    document.getElementById('c-location').value = '';
                    document.getElementById('c-img').value = '';
                    
                    closeCreateScreen();
                }
            } catch (err) {
                alert('Ошибка создания лота: ' + err.message);
            }
        }

        // Загрузка главного экрана (список лотов)
        async function loadMainScreen() {
            if (activeLotId !== null || isCreating) return; 
            try {
                const res = await fetch(`${API_URL}/api/lots`);
                const lots = await res.json();
                const grid = document.getElementById('lots-grid');
                grid.innerHTML = '';

                lots.forEach(lot => {
                    const timeLeft = Math.max(0, lot.endTime - Date.now());
                    const mins = Math.floor(timeLeft / 60000);
                    const timerText = timeLeft <= 0 || lot.status === 'finished' ? "Завершен" : `${mins} мин`;

                    const card = document.createElement('div');
                    card.className = "bg-gray-800 rounded-xl overflow-hidden border border-gray-700 shadow-lg flex flex-col justify-between active:scale-98 transition-all cursor-pointer p-2";
                    card.onclick = () => openLotDetail(lot.id);
                    
                    card.innerHTML = `
                        <div>
                            <div class="w-full h-28 bg-gray-950 rounded-lg overflow-hidden relative">
                                <img src="${lot.imageUrl}" class="w-full h-full object-cover">
                                <span class="absolute top-1 right-1 text-[10px] bg-black/60 px-1.5 py-0.5 rounded text-red-400 font-mono">${timerText}</span>
                            </div>
                            <h3 class="text-xs font-bold mt-2 text-gray-200 line-clamp-2">${lot.title}</h3>
                        </div>
                        <div class="mt-2 pt-1 border-t border-gray-700/50 flex justify-between items-center">
                            <span class="text-[11px] text-gray-400">Ставка:</span>
                            <span class="text-sm font-extrabold text-green-400">${lot.currentBid} ₴</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) {
                console.error("Ошибка загрузки сетки лотов:", e);
            }
        }

        // Открытие конкретного лота
        async function openLotDetail(id) {
            activeLotId = id;
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('detail-screen').classList.remove('hidden');
            loadLotDetail();
        }

        // Возврат назад
        function backToMain() {
            activeLotId = null;
            document.getElementById('detail-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            loadMainScreen();
        }

        // Загрузка информации об одном лоте
        async function loadLotDetail() {
            if (activeLotId === null || isCreating) return;
            try {
                const res = await fetch(`${API_URL}/api/lots/${activeLotId}`);
                if (!res.ok) throw new Error("Не удалось загрузить лот");
                const lot = await res.json();

                document.getElementById('error-block').classList.add('hidden');
                document.getElementById('lot-title').innerText = lot.title;
                document.getElementById('lot-desc').innerText = lot.description;
                document.getElementById('lot-price').innerText = `${lot.currentBid} грн`;
                document.getElementById('lot-blitz').innerText = `Блиц: ${lot.blitzPrice} грн`;
                document.getElementById('lot-step').innerText = `Шаг: ${lot.minStep} грн`;
                document.getElementById('lot-location').innerText = lot.location;
                document.getElementById('lot-img').src = lot.imageUrl;

                document.getElementById('bid-input').placeholder = `>= ${lot.currentBid + lot.minStep}`;

                const statusAuto = document.getElementById('my-auto-status');
                if (lot.autoBids && lot.autoBids[userId]) {
                    statusAuto.innerText = `Лимит: ${lot.autoBids[userId]} грн`;
                    statusAuto.className = "text-[11px] text-green-400 font-mono";
                } else {
                    statusAuto.innerText = "Выключен";
                    statusAuto.className = "text-[11px] text-gray-500 font-mono";
                }

                const diff = lot.endTime - Date.now();
                if (diff <= 0 || lot.status === 'finished') {
                    document.getElementById('lot-timer').innerText = "Завершен";
                    document.getElementById('action-zone').classList.add('hidden');
                    if (lot.winnerId === userId && lot.status !== 'paid') {
                        document.getElementById('pay-zone').classList.remove('hidden');
                    }
                } else {
                    document.getElementById('action-zone').classList.remove('hidden');
                    document.getElementById('pay-zone').classList.add('hidden');
                    const mins = Math.floor(diff / 60000);
                    const secs = Math.floor((diff % 60000) / 1000);
                    document.getElementById('lot-timer').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }
            } catch(e) {
                document.getElementById('error-block').classList.remove('hidden');
                document.getElementById('error-message').innerText = e.message;
            }
        }

        async function placeBid() {
            let amount = parseInt(document.getElementById('bid-input').value);
            if (!amount) return alert('Введите сумму ставки');
            sendBidRequest(amount);
        }

        async function placeBlitzBid() {
            let confirmBlitz = confirm("Вы уверены, что хотите купить лот по Блиц-цене?");
            if (confirmBlitz) sendBidRequest(9999999); 
        }

        async function sendBidRequest(amount) {
            try {
                const res = await fetch(`${API_URL}/api/bid`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lotId: activeLotId, userId, bidAmount: amount })
                });
                const data = await res.json();
                if (data.error) {
                    alert(data.error);
                } else {
                    confetti({ particleCount: 100, spread: 60, origin: { y: 0.8 } });
                    document.getElementById('bid-input').value = '';
                    loadLotDetail();
                }
            } catch(err) {
                alert("Ошибка отправки ставки: " + err.message);
            }
        }

        async function setupAutoBid() {
            let maxLimit = parseInt(document.getElementById('auto-input').value);
            if (!maxLimit) return alert('Укажите лимит автоторга');
            try {
                const res = await fetch(`${API_URL}/api/set-autobid`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lotId: activeLotId, userId, maxLimit })
                });
                const data = await res.json();
                if (data.error) alert(data.error);
                else {
                    alert('Робот успешно активирован!');
                    document.getElementById('auto-input').value = '';
                    loadLotDetail();
                }
            } catch(err) { alert("Ошибка автоторга: " + err.message); }
        }

        // Запуск циклов автоматического обновления
        setInterval(loadMainScreen, 3000);
        setInterval(loadLotDetail, 3000);
        loadMainScreen();
    </script>
</body>
</html>
