<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RSIZ Auction</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-user-select: none; user-select: none; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans p-4 selection:bg-yellow-500 selection:text-black">
    
    <div id="main-screen" class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold text-yellow-500 mb-6 text-center tracking-wide">🔨 Активные лоты</h1>
        <div id="lots-grid" class="grid grid-cols-2 gap-4">
            </div>
        <div class="text-center text-[11px] text-gray-600 mt-8 font-mono">@rsizauction_bot</div>
    </div>

    <div id="detail-screen" class="hidden max-w-md mx-auto">
        <button onclick="showMain()" class="mb-4 bg-gray-800 hover:bg-gray-700 text-gray-300 font-medium py-2 px-4 rounded-xl text-xs border border-gray-700 flex items-center gap-1 active:scale-95 transition-all">
            ⬅ Назад к списку
        </button>

        <div class="bg-gray-800 rounded-2xl overflow-hidden border border-gray-700 shadow-2xl">
            <img id="d-img" class="w-full h-56 object-cover opacity-90">
            
            <div class="p-4">
                <h2 id="d-title" class="text-2xl font-bold text-white tracking-tight">Загрузка...</h2>
                <p id="d-desc" class="text-gray-400 mt-2 text-sm leading-relaxed bg-gray-900/40 p-3 rounded-lg border border-gray-700/50">...</p>
                
                <div class="flex justify-between items-center mt-4 bg-gray-700/60 backdrop-blur-sm p-4 rounded-xl border border-gray-600/30">
                    <div>
                        <span class="text-xs text-gray-400 block uppercase font-medium tracking-wider mb-1">Текущая ставка:</span>
                        <span id="d-price" class="text-3xl font-black text-green-400">0 ₴</span>
                    </div>
                </div>

                <div class="mt-4 bg-gray-900/40 p-3 rounded-xl border border-gray-700/60">
                    <label class="text-xs text-gray-400 font-semibold block mb-2 uppercase">Сделать ставку:</label>
                    <div class="flex gap-2">
                        <input type="number" id="bid-input" class="w-1/2 bg-gray-900 border border-gray-600 focus:border-yellow-500 rounded-xl py-3 px-3 text-center text-lg font-bold text-white outline-none" placeholder="Сумма (₴)">
                        <button onclick="placeBid()" class="w-1/2 bg-yellow-500 text-gray-900 font-extrabold py-3 rounded-xl text-sm tracking-wide active:scale-[0.97] transition-all hover:bg-yellow-600">Поставить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Тот самый рабочий туннель из твоего сообщения
        const API_URL = 'https://81a74c99c70447.lhr.life'; 
        let activeId = null;

        // Инициализация Telegram Web App
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        async function loadLots() {
            try {
                const res = await fetch(`${API_URL}/api/lots`);
                if (!res.ok) throw new Error('Network response was not ok');
                const lots = await res.json();
                
                document.getElementById('lots-grid').innerHTML = lots.map(l => `
                    <div onclick="openLot(${l.id})" class="bg-gray-800 p-3 rounded-2xl cursor-pointer active:scale-95 transition-transform border border-gray-700 shadow-lg flex flex-col justify-between">
                        <div>
                            <img src="${l.imageUrl}" class="w-full h-28 object-cover rounded-xl">
                            <p class="text-sm font-bold mt-3 text-gray-200 line-clamp-2">${l.title}</p>
                        </div>
                        <div class="mt-3 pt-2 border-t border-gray-700/50 flex justify-between items-center">
                            <span class="text-[11px] text-gray-400">Ставка:</span>
                            <span class="text-base font-black text-green-400">${l.currentBid} ₴</span>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error("Ошибка загрузки лотов:", error);
                document.getElementById('lots-grid').innerHTML = `<p class="text-red-400 text-sm col-span-2 text-center">Ошибка соединения с сервером. Проверь туннель.</p>`;
            }
        }

        async function openLot(id) {
            activeId = id;
            try {
                const res = await fetch(`${API_URL}/api/lots/${id}`);
                const lot = await res.json();
                document.getElementById('d-img').src = lot.imageUrl;
                document.getElementById('d-title').innerText = lot.title;
                document.getElementById('d-desc').innerText = lot.description;
                document.getElementById('d-price').innerText = lot.currentBid + " ₴";
                
                // Подсказка для инпута
                document.getElementById('bid-input').placeholder = `>= ${lot.currentBid + lot.minStep}`;
                document.getElementById('bid-input').value = '';

                document.getElementById('main-screen').classList.add('hidden');
                document.getElementById('detail-screen').classList.remove('hidden');
            } catch (error) {
                alert("Не удалось загрузить данные лота.");
            }
        }

        function showMain() {
            activeId = null;
            document.getElementById('detail-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            loadLots();
        }

        async function placeBid() {
            const amount = document.getElementById('bid-input').value;
            if (!amount) return alert("Введите сумму!");

            try {
                const res = await fetch(`${API_URL}/api/bid`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({lotId: activeId, bidAmount: parseInt(amount)})
                });
                const data = await res.json();
                
                if(data.error) {
                    alert(data.error);
                } else {
                    // Вибрация в Telegram при успешной ставке
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    openLot(activeId); 
                }
            } catch (error) {
                alert("Ошибка отправки ставки.");
            }
        }

        // Запускаем загрузку при старте
        loadLots();
        
        // Автообновление списка каждые 3 секунды (эмуляция реального времени)
        setInterval(() => {
            if (activeId === null) loadLots();
            else openLot(activeId);
        }, 3000);
    </script>
</body>
</html>
